<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1418">
<meta name="description" content="An original open-world chemistry adventure. Explore Element City, borrow an authorized fleet car, and restore the city through scientific investigations.">
<title>Element City · Periodic Pursuit</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=5.0.0">
</head>
<body>
<canvas id="world" aria-label="Element City game world. Use the controls guide for keyboard and touch instructions."></canvas>
<div class="vignette" aria-hidden="true"></div>

<header id="hud" class="hud hidden">
  <div class="radar-block">
    <div class="radar"><canvas id="minimap" width="200" height="200" aria-label="Radar: gold route leads to your current destination"></canvas></div>
    <div class="radar-meta"><span id="district">RESEARCH QUARTER</span><span class="systems"><span id="systems">5 awaiting repair</span><span class="meter"><span id="incident-fill"></span></span></span></div>
  </div>
  <div class="hud-right"><span id="rep" class="rep">0 REP</span><span id="ride" class="ride">ON FOOT</span><button id="pause" class="square" aria-label="Pause game">❚❚</button></div>
</header>

<aside id="objective" class="objective hidden" aria-live="polite">
  <div class="eyebrow" id="objective-eyebrow">DISPATCH</div>
  <h2 id="objective-title">Your city. Your investigation.</h2>
  <p id="objective-text"></p>
  <button id="dispatch-btn" class="text-btn">Dispatch ›</button>
</aside>

<nav id="tools" class="tools hidden" aria-label="Investigation tools">
  <button data-tool="table" aria-label="Periodic table (T)"><b>T</b><span>Table</span></button>
  <button data-tool="notebook" aria-label="Notebook (N)"><b>N</b><span>Notebook</span></button>
  <button data-tool="map" aria-label="City map (M)"><b>M</b><span>Map</span></button>
  <button data-act="recenter" aria-label="Recenter camera (R)"><b>R</b><span>Recenter</span></button>
  <button id="camera-btn" data-act="camera" aria-label="Switch camera (C)"><b>C</b><span>Camera</span></button>
  <button data-tool="guide" aria-label="How to play"><b>?</b><span>Guide</span></button>
</nav>

<div id="context" class="context hidden">
  <span id="nearby"></span>
  <div class="context-buttons"><button id="interact">F · Interact</button><button id="vehicle">E · Enter car</button></div>
</div>

<div id="speedo" class="speedo hidden" aria-hidden="true"><b id="speed-value">0</b><small>KM/H</small><span class="gear" id="gear">D</span></div>

<div id="touch" class="touch hidden">
  <div id="joystick" role="group" aria-label="Movement and steering: touch anywhere in the lower-left area and slide">
    <div class="stick-ring"><span class="stick-knob" aria-hidden="true"></span></div>
    <span class="stick-caption">MOVE · STEER</span>
  </div>
  <div class="dpad" aria-label="Movement buttons"><button data-key="up" class="up" aria-label="Forward">▲</button><button data-key="left" class="left" aria-label="Left">◀</button><button data-key="down" class="down" aria-label="Backward">▼</button><button data-key="right" class="right" aria-label="Right">▶</button></div>
  <div class="pedals"><button data-key="down" class="brake" aria-label="Brake, then reverse">BRAKE<small>hold to reverse</small></button><button data-key="up" class="accelerator" aria-label="Accelerate">GAS</button></div>
</div>

<div id="banner" class="banner hidden" role="status" aria-live="polite"><small id="banner-kicker"></small><strong id="banner-title"></strong><span id="banner-sub"></span></div>
<div id="district-pop" class="district-pop hidden" aria-hidden="true"></div>
<aside id="field-workshop" class="hidden" aria-label="Street investigation"></aside>
<div id="toast" role="status" class="toast hidden"></div>
<div id="modal-root"></div>
<div id="boot-error" class="hidden" role="alert"></div>
<noscript><p style="padding:2rem;color:#fff">Element City needs JavaScript enabled.</p></noscript>
<script type="module" src="app.js?v=5.0.0"></script>
</body>
</html>
